name: build-llama-dspark

# Compila o llama.cpp com suporte a DSpark (PR ggml-org/llama.cpp#32218, AINDA ABERTO)
# e publica o tarball como asset de release. Roda uma vez; o byom pina a URL e o
# sha256 no perfil, então nenhuma sessão do Colab compila nada.
on:
  workflow_dispatch:
    inputs:
      llama_commit:
        description: "Commit do llama.cpp a compilar (PR #32218)"
        required: true
        default: "9f57b4453570c6a5fef01fec8e65a44d783a63e0"
      tag:
        description: "Tag da release a criar"
        required: true
        default: "llama-dspark-9f57b44"
      arches:
        description: "CMAKE_CUDA_ARCHITECTURES"
        required: true
        default: "75;80;89;90"   # T4=75, A100=80, L4=89, H100=90

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - name: Dependências
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git cmake build-essential ca-certificates curl file
          # O container não tem driver: o link precisa do stub libcuda do toolkit.
          ls -l /usr/local/cuda/lib64/stubs/
          ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
          ldconfig

      - name: Clonar llama.cpp no commit alvo
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git src
          cd src
          git checkout --detach "${{ inputs.llama_commit }}"
          echo "commit: $(git rev-parse HEAD)"

      - name: Configurar (CUDA, sem CURL, arquiteturas fixas)
        run: |
          cmake -S src -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DCMAKE_CUDA_ARCHITECTURES="${{ inputs.arches }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-L/usr/local/cuda/lib64/stubs -Wl,-rpath-link,/usr/local/cuda/lib64/stubs" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L/usr/local/cuda/lib64/stubs -Wl,-rpath-link,/usr/local/cuda/lib64/stubs"

      - name: Compilar llama-server
        run: cmake --build build --target llama-server -j"$(nproc)"

      - name: Empacotar
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp build/bin/llama-server pkg/
          # Bibliotecas compartilhadas que o servidor carrega em runtime.
          find build/bin -maxdepth 1 -name '*.so*' -exec cp -a {} pkg/ \;
          ls -la pkg
          ./pkg/llama-server --version || true
          short="$(cd src && git rev-parse --short=7 HEAD)"
          name="llama-dspark-${short}-cuda12.4-x64.tar.gz"
          echo "ASSET=$name" >> "$GITHUB_ENV"
          tar czf "$name" -C pkg .
          sha256sum "$name" | tee "$name.sha256"
          echo "SHA256=$(cut -d' ' -f1 "$name.sha256")" >> "$GITHUB_ENV"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release delete "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          gh release create "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "llama.cpp DSpark (PR #32218, ${{ inputs.llama_commit }})" \
            --notes "Build de CUDA 12.4 para sm_${{ inputs.arches }} a partir do commit ${{ inputs.llama_commit }} do PR ggml-org/llama.cpp#32218 (aberto). Depende do drafter dspark do perfil para funcionar; sem ele é um llama-server normal." \
            "$ASSET" "$ASSET.sha256"

      - name: Resumo
        run: |
          {
            echo "### llama.cpp DSpark"
            echo "- commit: \`${{ inputs.llama_commit }}\`"
            echo "- arquiteturas: \`${{ inputs.arches }}\`"
            echo "- asset: \`$ASSET\`"
            echo "- sha256: \`$SHA256\`"
            echo "- url: https://github.com/$GITHUB_REPOSITORY/releases/download/${{ inputs.tag }}/$ASSET"
          } >> "$GITHUB_STEP_SUMMARY"
