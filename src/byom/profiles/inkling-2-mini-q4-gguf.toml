name = "Inkling 2 Mini (4 bit, GGUF)"
description = "Quant recomendado UD-Q4_K_XL com visão e DSpark; cabe em L4."
opencode_output_limit = 8192
runtime = "llama-cpp"
catalog_model = "inkling-2-mini"
catalog_variant = "q4"

[config]
model = "inkling-2-mini"
served_model_name = "inkling-2-mini"
max_model_len = 65536
gpu = "L4"
gpu_high_mem = false
vllm_spec = "vllm"
vllm_enforce_eager = false
vllm_language_model_only = true
gpu_memory_utilization = 0.92
kv_cache_dtype = "fp8"
enable_auto_tool_choice = true
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"

[worker]
binary_url = "https://github.com/unslothai/llama.cpp/releases/download/b12588-mix-c0c3de8/app-b12588-mix-c0c3de8-linux-x64-cuda12-portable.tar.gz"
binary_sha256 = "4c30d5e3b3d7242cf3f214977c09a0d06102c71a713c256749909dcafa9f5980"
binary_dir = "llama.cpp"
model_repo = "unsloth/Inkling-2-Mini-GGUF"
model_patterns = ["*UD-Q4_K_XL*", "*mmproj-F16*", "*dspark*"]
main_pattern = "Inkling-2-Mini-UD-Q4_K_XL.gguf"
mmproj_pattern = "mmproj-F16.gguf"
drafter_pattern = "dspark-Inkling-2-Mini-Q8_0.gguf"
dspark = true
