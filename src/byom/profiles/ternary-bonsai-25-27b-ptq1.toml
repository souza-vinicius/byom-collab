name = "Ternary Bonsai 2.5 27B (PTQ1_0, fork PrismML)"
description = "GGUF PTQ1_0 do Bonsai 2.5 (ternário denso, 5,58 GiB, o arquivo que o card chama de 5,93 GB): exige o binário do fork PrismML; 64K na T4."
opencode_output_limit = 8192
runtime = "llama-cpp"
catalog_model = "ternary-bonsai-2.5-27b"
catalog_variant = "ptq1"

[config]
model = "ternary-bonsai-2.5-27b"
served_model_name = "ternary-bonsai-2.5-27b"
max_model_len = 65536
gpu = "T4"
gpu_high_mem = false
vllm_spec = "vllm"
vllm_enforce_eager = false
vllm_language_model_only = true
gpu_memory_utilization = 0.92
enable_auto_tool_choice = true
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"

# `PTQ1_0` precisa do binário do fork PrismML (o upstream recusa o tipo como
# desconhecido; o PR de merge está aberto). Build fixado: prism-b12128-d7b2896,
# asset linux-cuda-12.8-x64 de 228.535.760 B, sha256 conferido na API do GitHub
# e no arquivo baixado em 2026-11-24. Existe um build mais novo
# (prism-b12178-03ec600, publicado em 2026-11-24): o pin fica no b12128, que é
# onde o preset MTP foi medido — bump é um commit futuro.
[worker]
binary_url = "https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b12128-d7b2896/llama-prism-b12128-d7b2896-bin-linux-cuda-12.8-x64.tar.gz"
binary_sha256 = "d800a807295e73742d4dff7d3aa3a3438d6147882c9b609ef8bacba333bead01"
binary_dir = "llama.cpp"
model_repo = "prism-ml/Ternary-Bonsai-2.5-27B-GGUF"
model_patterns = ["Ternary-Bonsai-2.5-27B-PTQ1_0.gguf", "Ternary-Bonsai-2.5-27B-mmproj-Q8_0.gguf"]
main_pattern = "Ternary-Bonsai-2.5-27B-PTQ1_0.gguf"
mmproj_pattern = "Ternary-Bonsai-2.5-27B-mmproj-Q8_0.gguf"
llama_jinja = true
flash_attn = true

# Thinking do 27B: 1.0 / 0.95 / 20 / 0.0, sem presence nem repeat penalty.
# `min_p` explícito porque o default do llama.cpp é 0.05 (card e docs, 2026-11-24).
[worker.sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
