name = "Inkling 2 Mini (Strata SQ-10, T4)"
description = "Pack SQ-10 da Strata (Apache-2.0 no modelo, engine MIT) em T4; KV de 8 bits; 32K servidos de 1M documentado; sem visão nesta versão. Exige driver NVIDIA 575.51 ou mais novo: o engine se recusa a subir abaixo disso."
opencode_output_limit = 8192
runtime = "strata"
catalog_model = "inkling-2-mini-strata"
catalog_variant = "sq10"

[config]
model = "inkling-2-mini-strata"
served_model_name = "inkling-2-mini-strata"
max_model_len = 32768
gpu = "T4"
gpu_high_mem = false
vllm_spec = "vllm"
vllm_enforce_eager = false
vllm_language_model_only = true
gpu_memory_utilization = 0.92
# `--kv fp8` do engine `strata-inkling`: 1 byte por elemento (o mesmo 8 bits que
# o launcher do Strata chama de int8). O binário 0.1.70 recusa `--kv int8`.
kv_cache_dtype = "fp8"
enable_auto_tool_choice = true
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"

# Release v0.2.23 (2026-11-27): control 94.828.716 B e engine cuda12
# 655.962.569 B; os dois sha256 foram conferidos com `sha256sum` nos tarballs.
# O engine cuda13 (461.245.704 B) existe, mas pede driver 580.65 — o cuda12 é o
# que combina com o CUDA 12.8 já fixado no llama.cpp e com o driver do Colab.
[worker]
control_url = "https://github.com/Niko1221/Strata/releases/download/v0.2.23/strata-control-0.1.70-linux-x86_64.tar.gz"
control_sha256 = "f38d85bd5bd19393808e2bd0c7867e34c4fed968065371d77f37c11c451eeb6a"
control_dir = "strata-control"
engine_url = "https://github.com/Niko1221/Strata/releases/download/v0.2.23/strata-inkling-0.1.70-linux-x86_64-cuda-cuda12.tar.gz"
engine_sha256 = "cc078a9cf15e5e738a0396973748cbab352aed5f9cdf3a892802dfd407c6e526"
engine_dir = "strata-engine"
# `Inkling-2-Mini-SQ-10.strata` = 10.471.526.400 B = 9,75 GiB (tree do HF,
# revisão 5623ceb). O sha256 vem do `SHA256SUMS.txt` do próprio repo.
model_repo = "strata-engine/Inkling-2-Mini-Strata"
pack_pattern = "Inkling-2-Mini-SQ-10.strata"
sums_pattern = "SHA256SUMS.txt"
