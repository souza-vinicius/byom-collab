name = "Qwen-Image-2.1 (GGUF Q4_K)"
description = "Geração de imagens em T4 (15 GiB); POST /v1/images/generations, não chat."
opencode_output_limit = 8192
runtime = "image"
catalog_model = "qwen-image-2.1"
catalog_variant = "q4km"

[config]
model = "qwen-image-2.1"
served_model_name = "qwen-image-2.1"
max_model_len = 1
gpu = "T4"
gpu_high_mem = false
vllm_spec = "vllm"
vllm_enforce_eager = false
vllm_language_model_only = true
gpu_memory_utilization = 0.92
enable_auto_tool_choice = false
tool_call_parser = ""
reasoning_parser = ""

[worker]
# Build Unsloth cuda13 (Ubuntu 22.04, sm_75/80/86/89/90/100/120) com o
# sha256 do manifesto do release. O asset upstream 26.04/CPU exigia glibc
# 2.43 e morria no loader do Colab (glibc 2.39).
binary_url = "https://github.com/unslothai/stable-diffusion.cpp/releases/download/master-982-0518b34-u27b9ddc/sd-master-982-0518b34-u27b9ddc-bin-Linux-Ubuntu-22.04-x86_64-cuda13.zip"
binary_sha256 = "5129f05af93cac94f6e6182007ff9b18284fbea71f930f4b93360bc5a35d50a1"
binary_dir = "sdcpp"
model_patterns = ["leejet/Qwen-Image-2.1-GGUF::qwen_image_2.1-Q4_K.gguf", "Comfy-Org/Qwen-Image-2.1::vae/qwen_image_2.1_vae_bf16.safetensors", "Qwen/Qwen3-VL-8B-Instruct-GGUF::Qwen3VL-8B-Instruct-Q4_K_M.gguf", "Qwen/Qwen3-VL-8B-Instruct-GGUF::mmproj-Qwen3VL-8B-Instruct-F16.gguf"]

# Papéis explícitos: cada um vira uma flag do sd-server confirmada em
# https://github.com/leejet/stable-diffusion.cpp/blob/532d2c1/docs/models/qwen_image_2.1.md
# (consultado em 2026-11-24): --diffusion-model, --vae, --llm.
# O repo publica `qwen_image_2.1-Q4_K.gguf` (4,20 GB); NÃO existe Q4_K_M.
[worker.image_roles]
diffusion = "leejet/Qwen-Image-2.1-GGUF::qwen_image_2.1-Q4_K.gguf"
vae = "Comfy-Org/Qwen-Image-2.1::vae/qwen_image_2.1_vae_bf16.safetensors"
text_encoder = "Qwen/Qwen3-VL-8B-Instruct-GGUF::Qwen3VL-8B-Instruct-Q4_K_M.gguf"
# Edição de imagem: a doc da build fixada exige o projetor de visão do
# Qwen3-VL em `--llm_vision` (mmproj-Qwen3VL-8B-Instruct-F16.gguf, 1,16 GB).
vision = "Qwen/Qwen3-VL-8B-Instruct-GGUF::mmproj-Qwen3VL-8B-Instruct-F16.gguf"