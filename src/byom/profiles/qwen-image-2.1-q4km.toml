[config]
model = "qwen-image-2.1"
served_model_name = "qwen-image-2.1"
max_model_len = 1
gpu = "T4"
gpu_high_mem = false
vllm_spec = "vllm"
vllm_enforce_eager = false
vllm_language_model_only = true
