binary_sha256 = "0a02f7f51feb0691128f60cf6ff1c686ec23089561cfe7c3b72645f446646e13"
binary_dir = "sdcpp"
model_patterns = ["leejet/Qwen-Image-2.1-GGUF::qwen_image_2.1-Q4_K.gguf", "Comfy-Org/Qwen-Image-2.1::vae/qwen_image_2.1_vae_bf16.safetensors", "Qwen/Qwen3-VL-8B-Instruct-GGUF::Qwen3VL-8B-Instruct-Q4_K_M.gguf", "Qwen/Qwen3-VL-8B-Instruct-GGUF::mmproj-Qwen3VL-8B-Instruct-F16.gguf"]

# Papéis explícitos: cada um vira uma flag do sd-server confirmada em
# https://github.com/leejet/stable-diffusion.cpp/blob/532d2c1/docs/models/qwen_image_2.1.md
# (consultado em 2026-11-24): --diffusion-model, --vae, --llm.
# O repo publica `qwen_image_2.1-Q4_K.gguf` (4,20 GB); NÃO existe Q4_K_M.
[worker.image_roles]
diffusion = "leejet/Qwen-Image-2.1-GGUF::qwen_image_2.1-Q4_K.gguf"
