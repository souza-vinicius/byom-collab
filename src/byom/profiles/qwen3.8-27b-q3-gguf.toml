name = "Qwen3.8 27B (3 bit, GGUF)"
description = "GGUF 3 bit para L4 (pesos + runtime + KV passam dos 15 GiB da T4); alternativa ao AWQ em vLLM."
opencode_output_limit = 8192
runtime = "llama-cpp"
catalog_model = "qwen3.8-27b-gguf"
catalog_variant = "q3"

[config]
model = "qwen3.8-27b-gguf"
served_model_name = "qwen3.8-27b"
max_model_len = 32768
gpu = "L4"
gpu_high_mem = false
vllm_spec = "vllm"
vllm_enforce_eager = false
vllm_language_model_only = true
gpu_memory_utilization = 0.92
kv_cache_dtype = "fp8"
enable_auto_tool_choice = true
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"

[worker]
binary_url = "https://github.com/ggml-org/llama.cpp/releases/download/b12649/llama-b12649-bin-ubuntu-cuda-12.8-x64.tar.gz"
binary_sha256 = "110c23ca68ff1967806e248bcc3a726368ad74d261470ad165a0edcec339d0fa"
binary_dir = "llama.cpp"
model_repo = "unsloth/Qwen3.8-27B-GGUF"
model_patterns = ["*UD-Q3_K_XL*"]
main_pattern = "*UD-Q3_K_XL*"
