name = "Qwen3-TTS 12Hz 0.6B CustomVoice"
description = "TTS via vLLM-Omni; 9 timbres embutidos; endpoint /v1/audio/speech."
opencode_output_limit = 8192
runtime = "tts"
catalog_model = "qwen3-tts"
catalog_variant = "0.6b-customvoice"

[config]
model = "Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice"
served_model_name = "qwen3-tts-0.6b"
max_model_len = 1
gpu = "T4"
gpu_high_mem = false
vllm_spec = "vllm==0.34.0"
vllm_enforce_eager = false
vllm_language_model_only = false
gpu_memory_utilization = 0.3
enable_auto_tool_choice = false

[worker]
deploy_config = "qwen3_tts.yaml"
trust_remote_code = true
vllm_omni_spec = "vllm-omni==0.34.0"
