name = "Muse Glimmer 30B (q4)"
description = "Muse Glimmer 4 bit com visão; 64K exige A100 de 40 GB (L4 fica 1,2 GiB abaixo da folga)."
opencode_output_limit = 8192
runtime = "llama-cpp"
catalog_model = "muse-glimmer-30b"
catalog_variant = "q4"

[config]
model = "muse-glimmer-30b"
served_model_name = "muse-glimmer-30b"
max_model_len = 65536
gpu = "A100"
gpu_high_mem = false
vllm_spec = "vllm"
vllm_enforce_eager = false
vllm_language_model_only = true
gpu_memory_utilization = 0.92
enable_auto_tool_choice = true
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"

[worker]
binary_url = "https://github.com/ggml-org/llama.cpp/releases/download/b12649/llama-b12649-bin-ubuntu-cuda-12.8-x64.tar.gz"
binary_sha256 = "110c23ca68ff1967806e248bcc3a726368ad74d261470ad165a0edcec339d0fa"
binary_dir = "llama.cpp"
model_repo = "unsloth/Muse-Glimmer-30B-GGUF"
model_patterns = ["*UD-Q4_K_XL*", "*mmproj*"]
main_pattern = "*UD-Q4_K_XL*"
mmproj_pattern = "*mmproj*"
